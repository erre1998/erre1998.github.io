<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
    
    <head>
        <meta charset="utf-8">
        
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        >
        
        <title>
            {% if page.url == "/" %}
            {{ site.title }}
            {% elsif page.title %}
            {{ page.title }} · {{ site.title }}
            {% else %}
            {{ site.title }}
            {% endif %}
        </title>
        
        <meta
            name="description"
            content="{{ page.description | default: site.description }}"
        >
        
        <link
            rel="stylesheet"
            href="{{ '/assets/css/main.css' | relative_url }}"
        >
    </head>
    
    <body>
        
        <header class="site-header">
            
            <div class="container site-header-inner">
                
                <div class="site-identity">
                    
                    <a class="site-title" href="{{ '/' | relative_url }}">
                        {{ site.title }}
                    </a>
                    
                    <p class="site-subtitle">
                        {{ site.tagline }}
                    </p>
                    
                </div>
                
                {% include navigation.html %}
                
            </div>
            
        </header>
        
        <div class="site-mosaic" aria-hidden="true"></div>
        
        <main class="site-main">
            
            <div class="container">
                
                {{ content }}
                
            </div>
            
        </main>
        
        <footer class="site-footer">
            
            <div class="container site-footer-inner">
                
                <p class="site-footer-copyright">
                    &copy; {{ "now" | date: "%Y" }} Erik Renz
                </p>
                
                <div class="site-footer-meta">
                    
                    <a href="{{ '/privacy-policy/' | relative_url }}">
                        Privacy Policy
                    </a>
                    
                    <span aria-hidden="true">·</span>
                    
                    <span>
                        Last update: {{ site.time | date: "%-d %B %Y" }}
                    </span>
                    
                </div>
                
            </div>
            
        </footer>
        
    </body>
    
</html>
