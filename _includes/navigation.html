<nav class="site-navigation" aria-label="Main navigation">

    <ul class="navigation-list">

        {% for item in site.data.navigation %}

            <li class="navigation-item">

                <a
                    href="{{ item.url | relative_url }}"
                    {% if page.url == item.url %}
                        aria-current="page"
                    {% endif %}
                >
                    {{ item.title }}
                </a>

            </li>

        {% endfor %}

    </ul>

</nav>
